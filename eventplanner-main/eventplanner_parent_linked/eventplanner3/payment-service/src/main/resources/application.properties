# ===============================
# SERVER
# ===============================
server.port=8083
spring.application.name=payment-service

# ===============================
# SPRING SECURITY (BASIC AUTH)
# ===============================
spring.security.user.name=payment
spring.security.user.password=payment123
spring.security.user.roles=SERVICE

# ===============================
# DATABASE (H2 - DEV)
# ===============================
spring.datasource.url=jdbc:h2:mem:paymentdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ===============================
# EUREKA CLIENT (SECURED)
# ===============================
eureka.client.service-url.defaultZone=http://admin:admin123@localhost:8761/eureka
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${random.uuid}

# ===============================
# ACTUATOR
# ===============================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# ===============================
# LOGGING
# ===============================
logging.level.org.springframework=DEBUG
logging.level.com.eventplanner=DEBUG
debug=true
