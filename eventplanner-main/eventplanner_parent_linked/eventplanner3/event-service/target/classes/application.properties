############################################
# SERVER
############################################
server.port=8081
spring.application.name=event-service

############################################
# DATABASE (H2 - DEV)
############################################
spring.datasource.url=jdbc:h2:mem:eventdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=


spring.jpa.hibernate.ddl-auto=create-drop
# prod'da: validate / none

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

############################################
# EUREKA CLIENT
############################################
eureka.client.service-url.defaultZone=http://admin:admin123@localhost:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}

############################################
# ACTUATOR
############################################
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

############################################
# ACTUATOR INFO
############################################
info.app.name=Event Service
info.app.description=Handles event creation and listing
info.app.version=1.0.0
info.app.owner=EventPlanner Team
info.app.environment=DEV

############################################
# BASIC AUTH (SPRING SECURITY)
############################################
spring.security.user.name=eventuser
spring.security.user.password=event123
spring.security.user.roles=USER
